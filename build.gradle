plugins{
    id 'java-gradle-plugin'
    id 'groovy'
    id 'java'
    id 'com.gradle.plugin-publish' version '1.3.0'
    id 'nrlssc.gradle' version '5.0.145'
}

compileJava.options.encoding = 'UTF-8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    api gradleApi()
    api localGroovy()
    
    api 'mil.navy.nrlssc:gplugin-commons:5.0.22'

    testImplementation gradleTestKit(),
            'junit:junit:4.12'
}

hgit{
    forceGit = true
}


gradlePlugin {
    website = 'https://github.com/nrl-gradle/appdist-plugin'
    vcsUrl = 'https://github.com/nrl-gradle/appdist-plugin.git'

    //noinspection GroovyAssignabilityCheck
    plugins {
        create('appDistPlugin') {
            id = 'nrlssc.appdist'
            tags = ['application', 'app', 'distribution']
            displayName = 'Application Distribution Plugin'
            description = 'Adds tasks for generating distributables which, when decompressed, contain an executable pathing jar to your main method.'
            implementationClass = 'nrlssc.gradle.AppDistPlugin'

        }
    }
}
